name: publish

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Use Node.js 22
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm -r --filter '!@infinite-canvas-tutorial/app' --filter '!@infinite-canvas-tutorial/site' run build

      - name: Build site
        env:
          # VitePress bundles many demo deps (vello wasm, lottie, etc.) and exceeds the default ~4GB heap.
          NODE_OPTIONS: --max-old-space-size=6144
          # 配置了 ADSENSE_CLIENT 时默认启用；也可通过 vars/secrets.ADSENSE_ENABLED 显式控制
          ADSENSE_ENABLED: ${{ secrets.ADSENSE_CLIENT != '' && 'true' || vars.ADSENSE_ENABLED || secrets.ADSENSE_ENABLED }}
          ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
        run: pnpm --filter '@infinite-canvas-tutorial/site' run build

      - name: Prepare deployment tooling
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflare-pages"
          printf '{"private":true}\n' > "$RUNNER_TEMP/cloudflare-pages/package.json"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4abdc9b6ff77e69917753afff2a4ad14
          workingDirectory: ${{ runner.temp }}/cloudflare-pages
          packageManager: npm
          command: pages deploy "${{ github.workspace }}/packages/site/docs/.vitepress/dist" --project-name=infinite-canvas-tutorial --branch=master --commit-hash=${{ github.sha }}
          wranglerVersion: '4.137.0'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # - name: Algolia crawler creation and crawl
