name: React bindings

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        react: ['18.2.0', '19.2.3']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated React version
        run: |
          npm install --prefix "$RUNNER_TEMP/react-compat" --ignore-scripts --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ startsWith(matrix.react, '18') && '18' || '19' }} @types/react-dom@${{ startsWith(matrix.react, '18') && '18' || '19' }}
          echo "REACT_TEST_MODULES=$RUNNER_TEMP/react-compat/node_modules" >> "$GITHUB_ENV"
      - run: pnpm test:react
      - run: pnpm --filter '@infinite-canvas-tutorial/react...' build
      - run: pnpm test:react:package
      - run: pnpm exec tsc -p __tests__/react/browser/tsconfig.json
      - uses: actions/upload-artifact@v4
        with:
          name: react-build-${{ matrix.react }}
          # Paths are relative to packages/ inside the artifact. Restore them
          # there in each browser job; do not share node_modules or Vite caches.
          path: |
            packages/*/esm
            packages/*/lib
          if-no-files-found: error
          retention-days: 7

  browser-tests:
    name: react-${{ matrix.react }} / ${{ matrix.group.browser }} (${{ matrix.group.shard }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        react: ['18.2.0', '19.2.3']
        group:
          - browser: chromium
            config: playwright.react.config.ts
            shard: 1/2
          - browser: chromium
            config: playwright.react.config.ts
            shard: 2/2
          - browser: webkit
            config: playwright.react-webkit.config.ts
            shard: 1/3
          - browser: webkit
            config: playwright.react-webkit.config.ts
            shard: 2/3
          - browser: webkit
            config: playwright.react-webkit.config.ts
            shard: 3/3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated React version
        run: |
          npm install --prefix "$RUNNER_TEMP/react-compat" --ignore-scripts --no-audit --no-fund react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ startsWith(matrix.react, '18') && '18' || '19' }} @types/react-dom@${{ startsWith(matrix.react, '18') && '18' || '19' }}
          echo "REACT_TEST_MODULES=$RUNNER_TEMP/react-compat/node_modules" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: react-build-${{ matrix.react }}
          path: packages
      - run: pnpm exec playwright install --with-deps ${{ matrix.group.browser }}
      - name: Run browser shard
        run: >-
          pnpm exec playwright test -c ${{ matrix.group.config }}
          --shard=${{ matrix.group.shard }}
          --reporter=list,json,./scripts/browser-timing-reporter.mjs
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .test-results/react-results.json
          BROWSER_TEST_GROUP: react-${{ matrix.react }}-${{ matrix.group.browser }}-${{ matrix.group.shard }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: react-${{ matrix.react }}-${{ matrix.group.browser }}-${{ strategy.job-index }}
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # Keep the existing required check names. Both gates require the complete
  # compatibility matrix; a skipped or cancelled prerequisite is not success.
  react:
    if: ${{ always() }}
    needs: [checks, browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        react: ['18.2.0', '19.2.3']
    steps:
      - name: Require checks and every browser shard
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_TESTS_RESULT: ${{ needs.browser-tests.result }}
        run: |
          if [[ "$CHECKS_RESULT" != "success" || "$BROWSER_TESTS_RESULT" != "success" ]]; then
            echo "Checks: $CHECKS_RESULT; browser tests: $BROWSER_TESTS_RESULT"
            exit 1
          fi
