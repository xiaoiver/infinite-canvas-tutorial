name: component-testing

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-testing-webcomponents:
    name: Component Testing WebComponents
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install canvas native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: Install dependencies
        run: pnpm install

      - name: Install Chromium for component tests
        # The hosted runner has browser runtime libraries. --with-deps runs a
        # large apt transaction that can consume the entire 60-minute budget.
        run: pnpm exec playwright install chromium

      - name: Build
        # UI component tests only need workspace packages, not the VitePress site (OOM-prone).
        run: pnpm -r --filter '!@infinite-canvas-tutorial/app' --filter '!@infinite-canvas-tutorial/site' run build

      - name: Run Playwright tests
        run: pnpm test:ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ./*/**/playwright-report/
          retention-days: 30
