name: Lighting snapshot debug

on:
  push:
    branches: [codex/lighting-docs-demo-fixes]

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install headless GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglapi-mesa libosmesa6 libxi-dev libxext-dev libx11-dev libgl1-mesa-dev
      - name: Install dependencies
        run: pnpm install
        env:
          CXXFLAGS: -include cstdint
      - name: Render lighting scene
        run: |
          xvfb-run -s "-ac -screen 0 1280x1024x16" pnpm exec jest -c jest.ecs.config.js __tests__/ecs/lighting.spec.ts --runInBand --coverage=false || true
          test -f __tests__/ecs/snapshots/lighting-actual.png
          echo "LIGHTING_SNAPSHOT_BASE64=$(base64 -w0 __tests__/ecs/snapshots/lighting-actual.png)"
